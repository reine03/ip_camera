<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecureVision – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b12;
    --panel: #0d1520;
    --border: #1a3a5c;
    --accent: #00d4ff;
    --accent2: #0066ff;
    --danger: #ff3b5c;
    --success: #00ffaa;
    --text: #c8dff0;
    --muted: #4a6a88;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Exo 2', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; background: var(--bg);
    font-family: var(--sans); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: grid-scroll 20s linear infinite;
    pointer-events: none;
  }
  @keyframes grid-scroll { to { background-position: 0 40px; } }

  /* Scanline effect */
  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.08) 2px, rgba(0,0,0,0.08) 4px);
    pointer-events: none;
  }

  .corner-decoration {
    position: fixed;
    width: 200px; height: 200px;
    border: 2px solid var(--accent);
    opacity: 0.15;
  }
  .corner-decoration.tl { top: -50px; left: -50px; border-radius: 0 0 100% 0; animation: pulse 4s ease-in-out infinite; }
  .corner-decoration.br { bottom: -50px; right: -50px; border-radius: 100% 0 0 0; animation: pulse 4s ease-in-out infinite 2s; }
  @keyframes pulse { 0%,100%{opacity:0.1} 50%{opacity:0.25} }

  .login-wrapper {
    position: relative; z-index: 10;
    width: 100%; max-width: 420px; padding: 20px;
    animation: fadeUp 0.6s ease forwards;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }

  .brand {
    text-align: center; margin-bottom: 32px;
  }
  .brand-icon {
    width: 64px; height: 64px; margin: 0 auto 12px;
    border: 2px solid var(--accent); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    animation: rotate-ring 8s linear infinite;
  }
  @keyframes rotate-ring {
    0%{box-shadow: 0 0 0 0 rgba(0,212,255,0.4)}
    50%{box-shadow: 0 0 20px 5px rgba(0,212,255,0.2)}
    100%{box-shadow: 0 0 0 0 rgba(0,212,255,0.4)}
  }
  .brand-icon svg { width: 32px; height: 32px; stroke: var(--accent); fill: none; }
  .brand h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
  .brand h1 span { color: var(--accent); }
  .brand p { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); letter-spacing: 2px; margin-top: 4px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    position: relative;
    box-shadow: 0 0 40px rgba(0,102,255,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 20px; right: 20px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  .card-header {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 24px; padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .card-header span { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); letter-spacing: 1px; }

  .form-group { margin-bottom: 18px; }
  label { display: block; font-size: 0.72rem; font-family: var(--mono); color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }

  .input-wrap { position: relative; }
  .input-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; pointer-events: none; }

  input[type=text], input[type=password] {
    width: 100%; padding: 12px 12px 12px 40px;
    background: rgba(0,212,255,0.04);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text); font-family: var(--mono); font-size: 0.9rem;
    outline: none; transition: all 0.3s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,212,255,0.1), 0 0 20px rgba(0,212,255,0.05); }

  .btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border: none; border-radius: 8px;
    color: #fff; font-family: var(--sans); font-weight: 600;
    font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase;
    cursor: pointer; transition: all 0.3s; margin-top: 8px;
    position: relative; overflow: hidden;
  }
  .btn::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15));
    opacity: 0; transition: opacity 0.3s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 25px rgba(0,102,255,0.4); }
  .btn:hover::before { opacity: 1; }
  .btn:active { transform: translateY(0); }

  .alert {
    padding: 10px 14px; border-radius: 6px; font-size: 0.82rem;
    margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
  }
  .alert.error { background: rgba(255,59,92,0.1); border: 1px solid rgba(255,59,92,0.3); color: var(--danger); }
  .alert.success { background: rgba(0,255,170,0.1); border: 1px solid rgba(0,255,170,0.3); color: var(--success); }

  .divider { text-align: center; margin: 20px 0; position: relative; }
  .divider::before { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: var(--border); }
  .divider span { background: var(--panel); padding: 0 12px; font-size: 0.75rem; color: var(--muted); font-family: var(--mono); position: relative; }

  .link-row { text-align: center; margin-top: 16px; font-size: 0.82rem; color: var(--muted); }
  .link-row a { color: var(--accent); text-decoration: none; }
  .link-row a:hover { text-decoration: underline; }

  .demo-box {
    margin-top: 20px; padding: 12px 16px;
    background: rgba(0,212,255,0.04);
    border: 1px dashed rgba(0,212,255,0.2);
    border-radius: 8px;
  }
  .demo-box p { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; letter-spacing: 1px; }
  .demo-btns { display: flex; gap: 8px; }
  .demo-btn {
    flex: 1; padding: 8px; font-size: 0.72rem; font-family: var(--mono);
    border: 1px solid var(--border); border-radius: 6px;
    background: transparent; color: var(--text); cursor: pointer; transition: all 0.2s;
    letter-spacing: 1px;
  }
  .demo-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,212,255,0.05); }

  @media (max-width: 480px) { .card { padding: 24px 20px; } }
</style>
</head>
<body>
<div class="corner-decoration tl"></div>
<div class="corner-decoration br"></div>

<div class="login-wrapper">
  <div class="brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M3 12h2M19 12h2M12 3v2M12 19v2"/></svg>
    </div>
    <h1>Secure<span>Vision</span></h1>
    <p>// IP CAMERA SURVEILLANCE SYSTEM</p>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="status-dot"></div>
      <span>SYSTEM ONLINE · AUTHENTICATION REQUIRED</span>
    </div>

    {% if error %}
    <div class="alert error">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" name="username" id="username" placeholder="Enter username" autocomplete="username" required>
        </div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap">
          <svg viewBox="0 0 24 24" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" name="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
      </div>
      <button type="submit" class="btn">Authenticate</button>
    </form>

    <div class="divider"><span>DEMO ACCESS</span></div>

    <div class="demo-box">
      <p>// QUICK LOGIN WITH DEMO CREDENTIALS</p>
      <div class="demo-btns">
        <button class="demo-btn" onclick="fillDemo('admin','Admin@1234')">⚙ ADMIN</button>
        <button class="demo-btn" onclick="fillDemo('viewer','Viewer@1234')">👁 VIEWER</button>
      </div>
    </div>

    <div class="link-row">Don't have an account? <a href="/register">Register here</a></div>
  </div>
</div>

<script>
function fillDemo(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
  setTimeout(() => document.getElementById('loginForm').submit(), 300);
}
</script>
</body>
</html>
